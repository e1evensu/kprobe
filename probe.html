<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kb</title>
<body style="background:#fff;color:#000;font:15px monospace;padding:8px">
<pre id="o" style="white-space:pre-wrap;word-break:break-all;font-size:14px">running…</pre>
<script>
var out={href:location.href,hasWindVane:(typeof window.WindVane),hasBridge:!!window.__windvane__,res:[]};
function show(){document.getElementById('o').textContent=JSON.stringify(out,null,1);}
function ok(t,o,m){return function(r){out.res.push(t+" "+o+"."+m+" OK:"+JSON.stringify(r).slice(0,800));show();};}
function bad(t,o,m){return function(e){out.res.push(t+" "+o+"."+m+" FAIL:"+JSON.stringify(e).slice(0,300));show();};}
function C(t,o,m,p){
  try{
    if(window.WindVane&&window.WindVane.call){window.WindVane.call(o,m,p||{},ok(t,o,m),bad(t,o,m));out.res.push(t+" "+o+"."+m+" [dispatched via WindVane.call]");}
    else if(window.__windvane__&&window.__windvane__.call){window.__windvane__.call(o,m,p||{},ok(t,o,m),bad(t,o,m));out.res.push(t+" "+o+"."+m+" [dispatched via __windvane__.call]");}
    else{out.res.push("no call API");}
  }catch(e){out.res.push(t+" "+o+"."+m+" EXC:"+e);}
  show();
}
C("READ","WVLocation","getLocation",{address:true,gps:true,network:true});
C("READ","CNHybridBaseInfoPlugin","getBaseInfo",{});
C("READ","CNHybridCNAccount","isBindTaobao",{});
show();setTimeout(show,4000);setTimeout(show,9000);setTimeout(show,15000);
</script></body>
