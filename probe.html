<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kb</title>
<body style="background:#fff;color:#000;font:15px monospace;padding:8px">
<pre id="o" style="white-space:pre-wrap;word-break:break-all;font-size:14px">running…</pre>
<script>
var out={href:location.href,hasWE:!!window.WE,calls:[]};
function show(){document.getElementById('o').textContent=JSON.stringify(out,null,1);}
function ret(fn,action){
  try{ var r=window.WE[fn](action,""); out.calls.push("WE."+fn+"(\""+action+"\") => "+JSON.stringify(r).slice(0,400)); }
  catch(e){ out.calls.push("WE."+fn+"(\""+action+"\") !! "+String(e).slice(0,200)); }
  show();
}
try{
  ret("triggerString","get_deviceid");     // IMEI
  ret("triggerString","get_hash_deviceid"); // 设备哈希
  ret("triggerString","getPhones");         // 本机号
  ret("trigger","iswifi");                  // 布尔
}catch(e){out.calls.push("FATAL:"+e);}
show();
</script></body>
