<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kb</title>
<body style="background:#fff;color:#000;font:15px monospace;padding:8px">
<pre id="o" style="white-space:pre-wrap;word-break:break-all;font-size:14px">running…</pre>
<script>
var out={href:location.href,hasBridge:!!window.__windvane__,res:[]};
function show(){document.getElementById('o').textContent=JSON.stringify(out,null,1);}
function NC(obj,meth,param,tag){
  try{
    var r=window.__windvane__.nativeCall(obj,meth,param||{});
    out.res.push(tag+" ▸ "+obj+"."+meth+" => "+JSON.stringify(r).slice(0,600));
  }catch(e){out.res.push(tag+" ▸ "+obj+"."+meth+" !! "+String(e).slice(0,200));}
  show();
}
try{
  NC("WVLocation","getLocation",{address:true,gps:true},"READ-定位");
  NC("GG_WVLocation","getLocation",{address:true},"READ-定位2");
  NC("CNWVLocation","getLocation",{},"READ-定位3");
  NC("CNHybridBaseInfoPlugin","getBaseInfo",{},"READ-设备信息");
  NC("BaseInfo","getBaseInfo",{},"READ-设备信息2");
  NC("CNHybridCNAccount","isBindTaobao",{},"READ-账号绑定");
  NC("CNHybridCNAccount","queryAuthorizedResult",{},"READ-授权态");
  NC("WVContacts","find",{},"READ-通讯录");
}catch(e){out.res.push("FATAL:"+e);}
show();
</script></body>
