<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kb</title>
<body style="background:#fff;color:#000;font:15px monospace;padding:8px">
<pre id="o" style="white-space:pre-wrap;word-break:break-all;font-size:14px">running…</pre>
<script>
var out={href:location.href,hasWE:!!window.WE,weMethods:[],calls:[],err:null};
function show(){document.getElementById('o').textContent=JSON.stringify(out,null,1);}
function methodsOf(b){var s={},a=[],o=b;for(var d=0;d<5&&o;d++){try{Object.getOwnPropertyNames(o).forEach(function(p){if(!s[p]){s[p]=1;a.push(p);}});}catch(e){}o=Object.getPrototypeOf(o);}return a;}
function tryCall(name){
  try{
    var r=window.WE[name]();
    out.calls.push("WE."+name+"() => "+JSON.stringify(r).slice(0,500));
  }catch(e){out.calls.push("WE."+name+"() !! "+String(e).slice(0,200));}
  show();
}
function tryCallCB(name){
  try{
    window.WE[name]("{}",function(r){out.calls.push("WE."+name+"(cb) OK:"+JSON.stringify(r).slice(0,500));show();},function(e){out.calls.push("WE."+name+"(cb) FAIL:"+JSON.stringify(e).slice(0,200));show();});
    out.calls.push("WE."+name+"(cb) [dispatched]");
  }catch(e){out.calls.push("WE."+name+"(cb) EXC:"+e);}
  show();
}
try{
  if(window.WE){ out.weMethods=methodsOf(window.WE).slice(0,60); }
  // 只读探测：iswifi(无害) + get_deviceid(IMEI, 本机自有) —— 不碰 addCart/opennew 等写/危险
  tryCall("iswifi");
  tryCall("get_deviceid");
  tryCallCB("get_deviceid");
}catch(e){out.err=String(e);}
show();setTimeout(show,3000);
</script></body>
